
<!doctype html><html><head><meta charset="utf-8"><title>AI ML Engineer FINAL</title><style>body{font-family:Arial;max-width:1000px;margin:35px auto;padding:20px}textarea,input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{font-weight:bold}.card{padding:18px;background:#f4f4f4;border-radius:10px;margin-top:15px}pre{white-space:pre-wrap}</style></head><body><h1>AI ML Engineer — FINAL</h1><p>Give it a common tabular dataset and describe what you want to predict, cluster or detect.</p><div class=card><form id=f><textarea name=problem rows=4 placeholder="Example: Predict whether a customer will churn." required></textarea><input name=target placeholder="Target column (optional)"><input name=file type=file accept=".csv,.xlsx,.xls,.json,.parquet" required><button>Build My Model</button></form><div id=o></div></div><div class=card><h2>Ask AI</h2><textarea id=q rows=3 placeholder="Why was this model selected?"></textarea><button onclick=ask()>Ask AI</button><pre id=a></pre></div><script>f.onsubmit=async e=>{e.preventDefault();o.textContent="Analyzing, training and evaluating...";try{let r=await fetch("/build",{method:"POST",body:new FormData(f)}),d=await r.json();if(!r.ok)throw Error(d.detail);o.innerHTML="<b>Done</b><br>Task: "+d.task+"<br>Target: "+(d.target||"None")+"<br>Selected: "+d.selected_model+"<h3>Results</h3><pre>"+JSON.stringify(d.results,null,2)+"</pre><h3>RAG memory</h3><pre>"+JSON.stringify(d.retrieved_memories,null,2)+"</pre><h3>Generated API</h3><pre>"+d.generated_api_path+"</pre>"}catch(x){o.textContent="Error: "+x.message}};async function ask(){let f=new FormData();f.append("message",q.value);let r=await fetch("/chat",{method:"POST",body:f}),d=await r.json();a.textContent=d.answer}</script></body></html>
